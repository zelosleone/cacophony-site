<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cacophony</title>
  <meta name="description" content="A fast, native Apple Music player for Windows.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --ink: #111112; --ink2: #5c5c60; --paper: #f7f7f5; --rule: #e2e2df; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f3f3f1; --ink2: #a3a3a7; --paper: #111112; --rule: #2a2a2d; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 56px 24px 72px; }
    h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
    h2 { font-size: 19px; margin: 36px 0 8px; }
    p, li { color: var(--ink); }
    .quiet { color: var(--ink2); }
    a { color: inherit; text-underline-offset: 3px; }
    ul { padding-left: 20px; }
    li { margin: 6px 0; }
    footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--ink2); }
    .button { display: inline-block; margin-top: 20px; padding: 10px 20px; border-radius: 999px; background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600; }
    .icon { width: 88px; height: 88px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon.svg" alt="">
    <h1>Cacophony</h1>
    <p>A fast, native Apple Music player for Windows.</p>
    <p class="quiet">Full songs need an Apple Music subscription. Without one, Apple Music plays 30-second previews.</p>
    <a class="button" href="https://zelosleone.itch.io/cacophony">Get it on itch.io</a>
    <footer>
      <a href="privacy.html">Privacy</a> &middot; <a href="THIRD-PARTY-NOTICES.txt">Licenses</a><br>
      Cacophony isn't made, endorsed or sponsored by Apple. Apple Music is a trademark of Apple Inc.
    </footer>
  </main>
</body>
</html>
